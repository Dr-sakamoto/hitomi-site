name: 生成結果の確認

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 作品ページ・書棚・サイトマップが _works と一致しているか
        run: node _tools/build.mjs --check
